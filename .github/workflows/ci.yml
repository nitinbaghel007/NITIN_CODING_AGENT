# ==============================================================
# Nitin Coding Agent - continuous integration
#
# Validates on every push and pull request that:
#   1. the pinned dependencies from requirements.txt install into a
#      clean environment, and
#   2. the complete test suite passes with the exact same command
#      used locally (python -m pytest, configured in pyproject.toml).
#
# Deliberately minimal: one job, one Python version, one OS.
#   - Windows runner: README documents Windows as the supported
#     platform (safety rules in agent/core/safety.py are written
#     for Windows commands and paths) and every test run to date
#     was executed on Windows.
#   - Python 3.13: matches requires-python = ">=3.13" in
#     pyproject.toml and the verified 3.13.14 development runtime.
#   - No matrix, no coverage upload, no services, no deploy: the
#     repository does not require them.
# ==============================================================

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: python -m pytest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      # Exact local contract: testpaths/pythonpath come from
      # pyproject.toml. Any failure fails the workflow; nothing is
      # skipped, filtered, or allowed to fail.
      - name: Run test suite
        run: python -m pytest
